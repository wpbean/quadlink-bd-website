<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" width="550" height="400" role="img" aria-labelledby="switchIllustrationTitle">
  <title id="switchIllustrationTitle">মোবাইলে জরুরি কাজের সময় দুর্বল সংযোগে অনন্ত লোডিং স্ক্রিনে আটকে থাকা একজন ব্যবহারকারী থেকে Quadlink BD-এর দ্রুতগতির ফাইবার নেটওয়ার্কে পরিবর্তনের ইলাস্ট্রেশন</title>

  <defs>
    <linearGradient id="swSkyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3FBF6"/>
      <stop offset="100%" stop-color="#EAF6EE"/>
    </linearGradient>
    <linearGradient id="swTowerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E7045"/>
      <stop offset="100%" stop-color="#12291B"/>
    </linearGradient>
    <linearGradient id="swPersonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="swGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CAF6B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4CAF6B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .sw-flow-dash {
      stroke-dasharray: 1 10;
      animation: swDashFlow 1.4s linear infinite;
    }
    .sw-packet {
      animation: swMovePacket 2.1s linear infinite;
    }
    .sw-pulse-1 {
      animation: swPulse1 1.8s ease-in-out infinite;
    }
    .sw-pulse-2 {
      animation: swPulse2 1.8s ease-in-out infinite;
      animation-delay: 0.35s;
    }
    .sw-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: swSpin 1s linear infinite;
    }
    @keyframes swDashFlow {
      to { stroke-dashoffset: -22; }
    }
    @keyframes swMovePacket {
      0% { offset-distance: 0%; opacity: 0; }
      12% { opacity: 1; }
      88% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes swPulse1 {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.15; }
    }
    @keyframes swPulse2 {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.05; }
    }
    @keyframes swSpin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sw-flow-dash, .sw-packet, .sw-pulse-1, .sw-pulse-2, .sw-spin {
        animation: none;
      }
      .sw-pulse-1 { opacity: 0.5; }
      .sw-pulse-2 { opacity: 0.25; }
      .sw-packet { opacity: 0; }
    }
  </style>

  <rect width="550" height="400" rx="24" fill="url(#swSkyGrad)"/>
  <circle cx="410" cy="180" r="150" fill="url(#swGlowGrad)"/>
  <circle cx="60" cy="80" r="55" fill="#2E7045" opacity="0.06"/>
  <circle cx="500" cy="330" r="70" fill="#2E7045" opacity="0.07"/>

  <g opacity="0.5" fill="#2E7045">
    <circle cx="45" cy="140" r="3"/>
    <circle cx="75" cy="110" r="3"/>
    <circle cx="500" cy="110" r="3"/>
    <circle cx="520" cy="140" r="3"/>
    <circle cx="40" cy="320" r="3"/>
    <circle cx="510" cy="300" r="3"/>
  </g>

  <path d="M0 340 Q140 318 275 336 T550 332 V400 H0 Z" fill="#2E7045" opacity="0.08"/>
  <path d="M0 358 Q140 344 275 356 T550 352 V400 H0 Z" fill="#2E7045" opacity="0.12"/>

  <!-- frustrated user stuck on an infinite loading screen (left) -->
  <g transform="translate(148,246)">
    <!-- torso -->
    <path d="M-38 84 C -38 30, -28 -8, 0 -8 C 28 -8, 38 30, 38 84 Z" fill="url(#swPersonGrad)"/>

    <!-- arms holding phone -->
    <path d="M-29 6 Q -40 26 -25 46" stroke="url(#swPersonGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M29 6 Q 40 26 25 46" stroke="url(#swPersonGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>

    <!-- hair (drawn behind the face so it peeks out on top / sides) -->
    <circle cx="0" cy="-41" r="29" fill="#1E293B"/>
    <!-- head -->
    <circle cx="0" cy="-36" r="26" fill="#F6FAF7" stroke="#64748B" stroke-width="2.5"/>

    <!-- hands gripping the phone -->
    <circle cx="-25" cy="46" r="9" fill="#F6FAF7" stroke="#64748B" stroke-width="2"/>
    <circle cx="25" cy="46" r="9" fill="#F6FAF7" stroke="#64748B" stroke-width="2"/>

    <!-- phone -->
    <g transform="translate(0,42)">
      <rect x="-23" y="-44" width="46" height="86" rx="10" fill="#12291B"/>
      <rect x="-5" y="-40" width="10" height="3" rx="1.5" fill="#334155"/>
      <rect x="-18" y="-34" width="36" height="68" rx="4" fill="#F8FAFC"/>

      <!-- infinite loading spinner -->
      <g transform="translate(0,0)">
        <circle r="15" fill="none" stroke="#E2E8F0" stroke-width="4.5"/>
        <circle class="sw-spin" r="15" fill="none" stroke="#EF4444" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="24 70"/>
      </g>

      <rect x="-9" y="28" width="18" height="3" rx="1.5" fill="#334155" opacity="0.5"/>
    </g>

    <!-- frustration bubble -->
    <g transform="translate(42,-94)">
      <rect x="-19" y="-17" width="38" height="30" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
      <path d="M-6 11 L0 20 L6 11 Z" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
      <rect x="-2.4" y="-9.5" width="4.8" height="11" rx="2.4" fill="#EF4444"/>
      <circle cx="0" cy="5.5" r="2.4" fill="#EF4444"/>
    </g>
  </g>

  <!-- switch arrow with moving packet -->
  <g fill="none" stroke-linecap="round">
    <path id="swArrow" d="M198 252 C 250 205, 300 180, 355 175" stroke="#2E7045" stroke-width="2.5" opacity="0.5"/>
    <path class="sw-flow-dash" d="M198 252 C 250 205, 300 180, 355 175" stroke="#2E7045" stroke-width="2.5"/>
  </g>
  <path d="M350 167 L364 176 L349 186 Z" fill="#2E7045"/>
  <circle class="sw-packet" r="4" fill="#F59E0B" offset-path="path('M198 252 C 250 205, 300 180, 355 175')"/>

  <!-- new / strong connection (right, Quadlink fiber tower) -->
  <g transform="translate(410,190)">
    <rect x="-6" y="-24" width="12" height="118" rx="6" fill="url(#swTowerGrad)"/>
    <rect x="-42" y="-36" width="84" height="16" rx="8" fill="url(#swTowerGrad)"/>
    <circle cx="-42" cy="-28" r="6.5" fill="#4CAF6B"/>
    <circle cx="0" cy="-28" r="6.5" fill="#4CAF6B"/>
    <circle cx="42" cy="-28" r="6.5" fill="#4CAF6B"/>
    <circle cx="0" cy="-50" r="8" fill="#4CAF6B"/>
    <rect x="-3" y="-60" width="6" height="12" rx="3" fill="#12291B"/>

    <g stroke="#4CAF6B" stroke-width="3" fill="none" stroke-linecap="round">
      <path class="sw-pulse-1" d="M-26 -62 A 36 36 0 0 1 26 -62"/>
      <path class="sw-pulse-2" d="M-38 -74 A 54 54 0 0 1 38 -74"/>
    </g>

    <!-- full strong signal bars -->
    <g transform="translate(66,54)">
      <rect x="-8" y="6" width="8" height="10" rx="2" fill="#4CAF6B"/>
      <rect x="5" y="-2" width="8" height="18" rx="2" fill="#4CAF6B"/>
      <rect x="18" y="-10" width="8" height="26" rx="2" fill="#4CAF6B"/>
      <rect x="31" y="-18" width="8" height="34" rx="2" fill="#4CAF6B"/>
    </g>
  </g>

  <!-- checkmark confirmation bubble -->
  <g transform="translate(452,120)">
    <rect x="-28" y="-20" width="56" height="38" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M-8 16 L-2 28 L8 16 Z" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M-12 -2 L-3 8 L14 -10" fill="none" stroke="#4CAF6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
