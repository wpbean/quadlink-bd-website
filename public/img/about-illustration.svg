<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" width="550" height="400" role="img" aria-labelledby="aboutIllustrationTitle">
  <title id="aboutIllustrationTitle">Quadlink BD টেকনিক্যাল ও কাস্টমার সাপোর্ট টিমের ইলাস্ট্রেশন</title>

  <defs>
    <linearGradient id="aboutSkyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3FBF6"/>
      <stop offset="100%" stop-color="#EAF6EE"/>
    </linearGradient>
    <linearGradient id="aboutTorsoGradA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E7045"/>
      <stop offset="100%" stop-color="#12291B"/>
    </linearGradient>
    <linearGradient id="aboutTorsoGradB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF6B"/>
      <stop offset="100%" stop-color="#235636"/>
    </linearGradient>
    <linearGradient id="aboutDeskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E7045"/>
      <stop offset="100%" stop-color="#12291B"/>
    </linearGradient>
    <radialGradient id="aboutGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CAF6B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4CAF6B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .a-flow-dash {
      stroke-dasharray: 1 10;
      animation: aDashFlow 1.5s linear infinite;
    }
    .a-pulse-1 {
      animation: aPulse1 1.8s ease-in-out infinite;
    }
    .a-pulse-2 {
      animation: aPulse2 1.8s ease-in-out infinite;
      animation-delay: 0.35s;
    }
    .a-packet {
      animation: aMovePacket 2.2s linear infinite;
    }
    @keyframes aDashFlow {
      to { stroke-dashoffset: -22; }
    }
    @keyframes aPulse1 {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.15; }
    }
    @keyframes aPulse2 {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.05; }
    }
    @keyframes aMovePacket {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .a-flow-dash, .a-pulse-1, .a-pulse-2, .a-packet {
        animation: none;
      }
      .a-pulse-1 { opacity: 0.5; }
      .a-pulse-2 { opacity: 0.25; }
      .a-packet { opacity: 0; }
    }
  </style>

  <rect width="550" height="400" rx="24" fill="url(#aboutSkyGrad)"/>
  <circle cx="275" cy="190" r="180" fill="url(#aboutGlowGrad)"/>
  <circle cx="60" cy="70" r="55" fill="#2E7045" opacity="0.06"/>
  <circle cx="490" cy="330" r="70" fill="#2E7045" opacity="0.07"/>

  <g opacity="0.5" fill="#2E7045">
    <circle cx="45" cy="140" r="3"/>
    <circle cx="75" cy="110" r="3"/>
    <circle cx="480" cy="100" r="3"/>
    <circle cx="510" cy="130" r="3"/>
    <circle cx="40" cy="320" r="3"/>
    <circle cx="500" cy="300" r="3"/>
  </g>

  <path d="M0 340 Q140 318 275 336 T550 332 V400 H0 Z" fill="#2E7045" opacity="0.08"/>
  <path d="M0 358 Q140 344 275 356 T550 352 V400 H0 Z" fill="#2E7045" opacity="0.12"/>

  <!-- cloud / NOC monitoring node -->
  <g transform="translate(275,66)">
    <g fill="#FFFFFF" stroke="#2E7045" stroke-width="2">
      <ellipse cx="0" cy="0" rx="34" ry="19"/>
      <circle cx="-16" cy="-6" r="14"/>
      <circle cx="14" cy="-8" r="16"/>
    </g>
    <path class="a-pulse-1" d="M-14 -30 A 26 26 0 0 1 14 -30" fill="none" stroke="#4CAF6B" stroke-width="2.5" stroke-linecap="round"/>
    <path class="a-pulse-2" d="M-24 -38 A 38 38 0 0 1 24 -38" fill="none" stroke="#4CAF6B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path id="aLinkL" d="M275 90 C 220 120, 190 150, 175 185" stroke="#4CAF6B" stroke-width="2.5" opacity="0.5"/>
    <path id="aLinkR" d="M275 90 C 330 120, 360 150, 375 185" stroke="#4CAF6B" stroke-width="2.5" opacity="0.5"/>
    <path class="a-flow-dash" d="M275 90 C 220 120, 190 150, 175 185" stroke="#2E7045" stroke-width="2.5"/>
    <path class="a-flow-dash" d="M275 90 C 330 120, 360 150, 375 185" stroke="#2E7045" stroke-width="2.5"/>
  </g>
  <circle class="a-packet" r="3.5" fill="#F59E0B" offset-path="path('M275 90 C 220 120, 190 150, 175 185')"/>
  <circle class="a-packet" r="3.5" fill="#F59E0B" offset-path="path('M275 90 C 330 120, 360 150, 375 185')" style="animation-delay:1.1s"/>

  <!-- shared dashboard monitor -->
  <g transform="translate(275,196)">
    <rect x="-6" y="34" width="12" height="16" fill="#12291B"/>
    <rect x="-30" y="46" width="60" height="8" rx="4" fill="#12291B"/>
    <rect x="-58" y="-38" width="116" height="76" rx="8" fill="#12291B"/>
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="#FFFFFF"/>
    <g fill="#4CAF6B">
      <rect x="-40" y="6" width="10" height="18" rx="2"/>
      <rect x="-25" y="-4" width="10" height="28" rx="2"/>
      <rect x="-10" y="12" width="10" height="12" rx="2"/>
      <rect x="5" y="-10" width="10" height="34" rx="2"/>
      <rect x="20" y="0" width="10" height="24" rx="2"/>
    </g>
    <path d="M-42 -18 L-24 -2 L-6 -14 L14 4" fill="none" stroke="#2E7045" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  </g>

  <!-- desk -->
  <rect x="55" y="284" width="440" height="16" rx="8" fill="url(#aboutDeskGrad)"/>
  <rect x="80" y="300" width="10" height="46" fill="#12291B" opacity="0.85"/>
  <rect x="460" y="300" width="10" height="46" fill="#12291B" opacity="0.85"/>

  <!-- plant -->
  <g transform="translate(105,266)">
    <path d="M-10 18 L10 18 L7 0 L-7 0 Z" fill="#EAF6EE" stroke="#2E7045" stroke-width="1.5"/>
    <path d="M0 0 C -14 -4, -16 -22, -2 -30 C 4 -16, 2 -6, 0 0 Z" fill="#4CAF6B"/>
    <path d="M0 0 C 12 -6, 16 -20, 6 -32 C -2 -18, -2 -8, 0 0 Z" fill="#2E7045"/>
  </g>

  <!-- mug -->
  <g transform="translate(275,272)">
    <rect x="-9" y="0" width="18" height="16" rx="3" fill="#FFFFFF" stroke="#2E7045" stroke-width="1.5"/>
    <path d="M9 3 q8 0 8 6 q0 6 -8 6" fill="none" stroke="#2E7045" stroke-width="1.5"/>
  </g>

  <!-- Figure A: left teammate at laptop -->
  <g transform="translate(178,206)">
    <path d="M-40 84 C -40 30, -30 -8, 0 -8 C 30 -8, 40 30, 40 84 Z" fill="url(#aboutTorsoGradA)"/>
    <circle cx="0" cy="-34" r="27" fill="#F6FAF7" stroke="#2E7045" stroke-width="2.5"/>
    <path d="M-27 -40 A 27 22 0 0 1 27 -40 L 24 -50 A 30 14 0 0 0 -24 -50 Z" fill="#12291B"/>
    <rect x="-30" y="52" width="20" height="30" rx="8" fill="url(#aboutTorsoGradA)" transform="rotate(18 -30 52)"/>
    <rect x="10" y="52" width="20" height="30" rx="8" fill="url(#aboutTorsoGradA)" transform="rotate(-18 40 82)"/>
    <!-- laptop -->
    <g transform="translate(-4,74)">
      <rect x="-34" y="-46" width="52" height="38" rx="4" fill="#12291B"/>
      <rect x="-30" y="-42" width="44" height="30" rx="2" fill="#FFFFFF"/>
      <g fill="#4CAF6B" opacity="0.9">
        <rect x="-25" y="-36" width="20" height="4" rx="2"/>
        <rect x="-25" y="-29" width="30" height="4" rx="2"/>
        <rect x="-25" y="-22" width="14" height="4" rx="2"/>
      </g>
      <path d="M-38 -8 L38 -8 L46 8 L-46 8 Z" fill="#2E7045"/>
    </g>
  </g>

  <!-- Figure B: right teammate with headset -->
  <g transform="translate(378,206)">
    <path d="M-40 84 C -40 30, -30 -8, 0 -8 C 30 -8, 40 30, 40 84 Z" fill="url(#aboutTorsoGradB)"/>
    <circle cx="0" cy="-34" r="27" fill="#F6FAF7" stroke="#2E7045" stroke-width="2.5"/>
    <path d="M-27 -34 A 27 27 0 0 1 27 -34" fill="none" stroke="#12291B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-27" cy="-30" r="6" fill="#12291B"/>
    <circle cx="27" cy="-30" r="6" fill="#12291B"/>
    <path d="M24 -28 Q 34 -4 14 4" fill="none" stroke="#12291B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="14" cy="4" r="4" fill="#12291B"/>
    <rect x="-30" y="52" width="20" height="30" rx="8" fill="url(#aboutTorsoGradB)" transform="rotate(-18 -30 52)"/>
    <rect x="10" y="52" width="20" height="30" rx="8" fill="url(#aboutTorsoGradB)" transform="rotate(18 40 82)"/>
    <!-- laptop -->
    <g transform="translate(4,74)">
      <rect x="-18" y="-46" width="52" height="38" rx="4" fill="#12291B"/>
      <rect x="-14" y="-42" width="44" height="30" rx="2" fill="#FFFFFF"/>
      <path d="M-8 -30 L-2 -18 L4 -34 L10 -14 L16 -26" fill="none" stroke="#4CAF6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-22 -8 L54 -8 L62 8 L-30 8 Z" fill="#2E7045"/>
    </g>
  </g>

  <!-- support chat bubble -->
  <g transform="translate(452,146)">
    <rect x="-30" y="-22" width="60" height="40" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M-8 18 L-2 30 L8 18 Z" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M-13 -4 L-3 6 L15 -12" fill="none" stroke="#4CAF6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
